plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.destos.ares"
    // flutter_tts eklentisi 36 istiyor; diğer eklentiler (geolocator,
    // android_intent_plus, vb.) NDK 25.1.8937393 istiyor. Loglardaki
    // önerilen değerlere göre güncellendi.
    compileSdk = 36
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.destos.ares"
        // flutter_tts, minSdk'nin en az 24 olmasını şart koşuyor (Android 7.0).
        // Bu, uygulamanın artık 2016 öncesi çok eski cihazlarda kurulamayacağı
        // anlamına gelir - bu tablet için sorun teşkil etmemeli.
        minSdk = 24
        targetSdk = 36
        versionCode = 2
        versionName = "1.0.1"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            // R8 (kod küçültücü), yeni Kotlin sürümlerinin (2.1+) ürettiği
            // metadata formatını henüz tam okuyamıyor
            // ("Provided Metadata instance has version 2.1.0, while maximum
            // supported version is 2.0.0" hatası). Kişisel/tek cihaz kullanımı
            // için küçültme şart olmadığından devre dışı bırakıyoruz - bu,
            // AGP sürümüyle tekrar uğraşmadan sorunu kesin olarak çözer.
            minifyEnabled = false
            // shrinkResources, minifyEnabled kapalıyken açık olamaz
            // ("Removing unused resources requires unused code shrinking to
            // be turned on" hatası) - o yüzden bunu da kapatıyoruz.
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}
