name: dest_os_ares
description: DEST-OS ARES Launcher - Orijinal tasarım arka planlı
publish_to: 'none'
version: 1.5.9+19

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  android_intent_plus: ^5.0.2
  installed_apps: ^1.5.0
  url_launcher: ^6.3.0
  battery_plus: ^6.0.0
  geolocator: ^13.0.1
  flutter_tts: ^4.2.5
  detect_clap_sound_flutter: ^1.1.2
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  # Sesli komutları artık cihaz üzerindeki speech_to_text eklentisiyle değil,
  # kaydedip Google Gemini API'sine göndererek yazıya çeviriyoruz - bu hem
  # speech_to_text'in çözülemeyen Gradle hatasını ortadan kaldırıyor hem de
  # tanıma kalitesini artırıyor.
  record: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# geolocator paketinin Android tarafı (geolocator_android) 4.6.2 sürümünde
# bilinen bir Gradle yapılandırma hatası var ("compileSdkVersion is not
# specified" / "unknown property 'flutter'") ve APK derlemesini bozuyor.
# Bir önceki, sorunsuz çalışan sürümü sabitliyoruz.
#
# record_linux 0.7.2 ise güncel record_platform_interface (1.6.0) ile uyumsuz
# ("startStream" ve "hasPermission" eksik/uyumsuz) ve Dart derlemesini
# durduruyor. Tabletimiz zaten Android olduğu için Linux bileşeninin işlevi
# yok, sadece derlenebilir/uyumlu bir sürüme sabitliyoruz.
dependency_overrides:
  geolocator_android: 4.6.1
  record_linux: 1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/background.png
    - assets/images/ares_chat_bg.png
    - assets/ares_tasks.json
    - assets/ares_config.json
